<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E04300">
<title>AI NEXT Season 2 — NEXT Passport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="s2-theme.css">
<style>
  /* ===== layout ===== */
  .app{ position:relative; z-index:2; max-width:480px; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
  .appbar{ display:none; align-items:center; justify-content:space-between; gap:10px; margin:12px 14px 0; padding:8px 10px 8px 14px; border-radius:18px;
    background:rgba(17,9,6,.55); border:1px solid var(--glass-brd); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    box-shadow:0 10px 30px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.25); position:sticky; top:10px; z-index:20; }
  .appbar.show{ display:flex; }
  .appbar img{ height:40px; width:auto; display:block; }
  .appbar .season{ font-family:'Chakra Petch'; font-size:9.5px; font-weight:700; letter-spacing:.3em; color:var(--gold); text-transform:uppercase; margin-top:2px; }
  .chip-btn{ display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); border:1px solid var(--glass-brd); border-radius:999px;
    padding:7px 12px; cursor:pointer; color:#fff; font-family:'Chakra Petch'; font-weight:700; font-size:12.5px; letter-spacing:.06em; }
  .screen-wrap{ flex:1; padding:22px 20px 128px; }
  .screen{ min-height:calc(100dvh - 170px); display:flex; flex-direction:column; animation:rise .45s ease both; }
  @keyframes rise{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes blink{ 0%,100%{ opacity:.25; } 50%{ opacity:1; } }

  h1.t, h2.t{ font-family:'Chakra Petch'; font-weight:700; margin:12px 0 4px; line-height:1.2; }
  h1.t{ font-size:30px; } h2.t{ font-size:26px; }
  .sub-en{ margin:0; font-family:'Chakra Petch'; font-size:12px; font-weight:600; letter-spacing:.24em; color:var(--gold); text-transform:uppercase; }
  .desc{ margin:12px 0 0; font-size:15px; line-height:1.65; color:var(--muted); }
  .back{ align-self:flex-start; display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--muted); font-family:'Chakra Petch'; font-size:13px; padding:0; margin-bottom:16px; cursor:pointer; }
  .mt{ margin-top:12px; } .mt2{ margin-top:20px; }
  .link-sm{ display:inline-flex; align-items:center; justify-content:center; gap:6px; background:none; border:none; color:var(--muted); font-family:'Chakra Petch'; font-size:12.5px; cursor:pointer; margin-top:14px; text-decoration:none; width:100%; }
  .err{ margin:12px 0 0; color:#fff; background:rgba(120,10,0,.45); border:1px solid rgba(255,160,140,.6); border-radius:12px; padding:10px 13px; font-size:14px; }

  /* ===== landing hero ===== */
  /* crop to the visor/face — the key visual's own "AI NEXT" logo (lower third) stays out of frame */
  .hero{ position:relative; border-radius:24px; overflow:hidden; aspect-ratio:16/10; margin-top:6px; }
  .hero img{ width:100%; height:100%; object-fit:cover; object-position:50% 4%; display:block; }
  .hero::after{ content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(22,7,2,0) 45%, rgba(22,7,2,.92) 100%); }
  .hero .cap{ position:absolute; left:18px; right:18px; bottom:16px; z-index:2; }
  .hero .cap .s2-metal{ font-size:34px; line-height:1; }
  .hero .laser{ margin:10px 0 0; }
  .steps{ display:flex; flex-direction:column; gap:8px; margin:16px 0 4px; }
  .step-row{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:15px; }
  .step-row .num{ width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:var(--obsidian); border:1.5px solid rgba(255,145,50,.7); color:var(--gold); font-family:'Chakra Petch'; font-weight:700; font-size:13px; box-shadow:0 0 10px rgba(255,122,0,.35); }
  .step-row .st{ font-family:'Chakra Petch'; font-weight:700; font-size:14.5px; }
  .step-row .ss{ font-size:12px; color:var(--muted); }

  /* ===== check-in ===== */
  .hint-chips{ display:flex; gap:6px; flex-wrap:wrap; margin:10px 0 0; }
  .hint-chips span{ font-size:12px; padding:5px 10px; border-radius:99px; background:rgba(17,9,6,.35); border:1px solid rgba(255,255,255,.25); color:var(--muted); }
  .scan-visor{ width:230px; height:74px; border-radius:40px; margin:10px auto; position:relative; overflow:hidden; }
  .scan-visor::before{ content:''; position:absolute; left:16px; right:16px; top:50%; height:4px; margin-top:-2px; border-radius:4px; background:rgba(255,109,0,.35); }
  .scan-visor::after{ content:''; position:absolute; top:50%; width:16px; height:16px; margin-top:-8px; border-radius:50%; background:#FFF3D1; box-shadow:0 0 16px #FF7A00, 0 0 30px #FF5500; animation:sweep 1.1s ease-in-out infinite alternate; }
  @keyframes sweep{ from{ left:18px; } to{ left:calc(100% - 34px); } }
  .pick{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; padding:14px; border-radius:16px; cursor:pointer; color:#fff; font-family:inherit; }
  .pick .pn{ font-family:'Chakra Petch'; font-weight:700; font-size:16.5px; } .pick .ps{ font-size:12.5px; color:var(--muted); }

  .agree{ display:flex; gap:11px; align-items:flex-start; font-size:14.5px; margin-top:12px; padding:13px 14px; border-radius:15px; cursor:pointer; }
  .agree input{ width:22px; height:22px; accent-color:#FF7A00; flex:0 0 auto; margin-top:1px; }
  .agree .sub{ color:var(--muted); font-size:12.5px; display:block; margin-top:2px; }

  /* ===== passport (hub) ===== */
  .passport{ padding:18px; }
  .passport .row1{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; position:relative; }
  .passport .pname{ font-family:'Chakra Petch'; font-weight:700; font-size:24px; line-height:1.15; margin-top:4px; }
  .passport .pfull{ font-size:12.5px; color:var(--muted); }
  .badge{ font-family:'Chakra Petch'; font-weight:700; font-size:12px; padding:5px 11px; border-radius:99px; white-space:nowrap;
    background:rgba(255,158,0,.18); border:1px solid var(--gold); color:var(--gold); }
  .passport .laser{ margin:14px 0; }
  .meta{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; position:relative; }
  .meta > div{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); border-radius:12px; padding:8px 4px; min-width:0; }
  .meta .l{ font-family:'Chakra Petch'; font-size:10px; letter-spacing:.12em; color:var(--muted); text-transform:uppercase; }
  .meta .v{ font-family:'Chakra Petch'; font-weight:700; font-size:13.5px; color:var(--gold); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rings{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; position:relative; }
  .ring-wrap{ text-align:center; }
  .ring{ width:62px; height:62px; margin:0 auto 6px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative;
    background:radial-gradient(circle at 35% 30%, #2a1710, #0b0503 70%); border:2px dashed rgba(255,255,255,.28); color:rgba(255,255,255,.45);
    font-family:'Chakra Petch'; font-weight:700; font-size:20px; }
  .ring.open{ border:2px solid #fff; color:#fff; animation:ringPulse 1.8s infinite; }
  @keyframes ringPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,255,255,.45); } 50%{ box-shadow:0 0 0 10px rgba(255,255,255,0); } }
  .ring.done{ border:2.5px solid var(--gold); color:var(--gold); transform:rotate(-10deg);
    background:radial-gradient(circle at 35% 30%, rgba(255,190,80,.35), #140803 72%); box-shadow:0 0 16px var(--neon), inset 0 0 10px rgba(255,160,0,.45); }
  .ring.done::after{ content:''; position:absolute; inset:5px; border-radius:50%; border:1px solid rgba(255,209,102,.55); }
  .ring-wrap .rl{ font-family:'Chakra Petch'; font-weight:700; font-size:12px; }
  .ring-wrap .rs{ font-size:11px; color:var(--muted); }
  .ring.slam{ animation:slam .55s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes slam{ 0%{ transform:scale(2.6) rotate(-30deg); opacity:0; } 55%{ transform:scale(.86) rotate(-6deg); opacity:1; } 75%{ transform:scale(1.08) rotate(-12deg); } 100%{ transform:scale(1) rotate(-10deg); } }
  .shake{ animation:shake .35s ease; }
  @keyframes shake{ 0%,100%{ transform:none; } 25%{ transform:translate(-3px,2px); } 50%{ transform:translate(3px,-2px); } 75%{ transform:translate(-2px,-1px); } }
  .particle{ position:fixed; width:8px; height:8px; border-radius:50%; pointer-events:none; z-index:90;
    background:radial-gradient(circle, #FFF6D6, #FFD166 45%, #FF8A00); box-shadow:0 0 10px #FFB000; animation:burst .9s ease-out forwards; }
  @keyframes burst{ to{ transform:translate(var(--dx), var(--dy)) scale(.2); opacity:0; } }

  .lunch{ display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:16px; margin-top:14px; }
  .lunch .ic{ font-size:22px; }
  .sec-h{ font-family:'Chakra Petch'; font-weight:700; font-size:12px; letter-spacing:.24em; color:var(--gold); text-transform:uppercase; margin:20px 0 10px; }
  .task{ display:flex; align-items:center; gap:13px; width:100%; text-align:left; padding:14px; border-radius:17px; cursor:pointer; color:#fff; font-family:inherit; margin-bottom:10px; }
  .task.locked{ opacity:.82; }
  .task .tn{ width:42px; height:42px; border-radius:13px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'Chakra Petch'; font-weight:700; background:var(--obsidian); border:1px solid rgba(255,145,50,.55); color:var(--gold); }
  .task .tt{ font-family:'Chakra Petch'; font-weight:700; font-size:15.5px; }
  .task .ts{ font-size:12.5px; color:var(--muted); }
  .task .tb{ font-family:'Chakra Petch'; font-weight:700; font-size:12px; padding:5px 10px; border-radius:99px; flex-shrink:0; border:1px solid var(--glass-brd); }
  .task .tb.go{ background:#fff; color:var(--cta-text); border-color:#fff; }
  .task .tb.ok{ color:var(--ok); border-color:rgba(56,242,155,.5); }

  /* ===== cooldown ===== */
  .cool{ text-align:center; padding:24px 18px; }
  .charge-val{ font-family:'Chakra Petch'; font-weight:700; font-size:56px; line-height:1; color:var(--gold); text-shadow:0 0 22px #FF6D00; margin:10px 0 4px; font-variant-numeric:tabular-nums; }
  .charge-bar{ height:10px; border-radius:99px; background:rgba(17,9,6,.45); overflow:hidden; margin:12px 0 4px; border:1px solid rgba(255,255,255,.2); }
  .charge-bar i{ display:block; height:100%; background:var(--laser); box-shadow:0 0 12px #FF7A00; transition:width .2s; }
  .charge-btn{ position:relative; overflow:visible; margin-top:14px; font-size:17px; padding:20px; }
  .plus{ position:fixed; pointer-events:none; z-index:90; font-family:'Chakra Petch'; font-weight:700; color:var(--gold); text-shadow:0 0 10px #FF6D00; animation:plus .8s ease-out forwards; }
  @keyframes plus{ to{ transform:translateY(-60px); opacity:0; } }
  .live{ display:inline-flex; align-items:center; gap:8px; font-family:'Chakra Petch'; font-size:11px; letter-spacing:.2em; color:var(--gold); text-transform:uppercase; }
  .live i{ width:8px; height:8px; border-radius:50%; background:var(--gold); animation:blink 1.4s infinite; }

  /* ===== forms ===== */
  .stepper{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:12px 0 4px; }
  .stepper button{ padding:9px 6px; border-radius:12px; cursor:pointer; text-align:left; font-family:'Chakra Petch'; color:var(--muted);
    background:rgba(17,9,6,.35); border:1px solid rgba(255,255,255,.2); }
  .stepper button b{ display:block; font-size:12px; letter-spacing:.1em; } .stepper button span{ font-size:11px; }
  .stepper button.on{ background:var(--obsidian); color:#fff; border-color:rgba(255,145,50,.8); box-shadow:0 0 14px rgba(255,122,0,.35); }
  .stepper button.ok{ color:var(--ok); border-color:rgba(56,242,155,.45); }
  .stepper-laser{ height:3px; border-radius:3px; background:rgba(255,255,255,.18); overflow:hidden; margin-bottom:6px; }
  .stepper-laser i{ display:block; height:100%; background:var(--laser); box-shadow:0 0 10px #FF7A00; transition:width .35s; }
  .draft-note{ font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; min-height:18px; }
  .qcard{ padding:16px; border-radius:18px; margin-top:12px; }
  .qcard.miss{ border-color:#FFB4A6; box-shadow:0 0 0 2px rgba(255,140,120,.45); }
  label.q{ display:block; font-size:15.5px; font-weight:600; margin:0 0 10px; line-height:1.55; }
  label.q .opt{ color:var(--muted); font-weight:400; font-size:13px; }
  .qhint{ font-size:13px; color:var(--muted); margin:-4px 0 10px; }
  textarea.field{ min-height:86px; resize:vertical; font-size:15.5px; }
  select.field{ appearance:none; -webkit-appearance:none; background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%); background-position:calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size:6px 6px; background-repeat:no-repeat; }
  select.field option{ color:#111; }
  .scale{ display:flex; gap:7px; } .scale.ten{ flex-wrap:wrap; } .scale.ten button{ flex:0 0 calc(18.2% - 1px); }
  .scale button, .gscale button{ flex:1; padding:12px 0; border-radius:12px; border:1px solid rgba(255,255,255,.28); background:rgba(17,9,6,.4); color:var(--muted); font-size:16px; font-weight:700; cursor:pointer; font-family:'Chakra Petch'; }
  .scale button.sel, .gscale button.sel, .seg button.sel{ background:#fff; color:var(--cta-text); border-color:#fff; box-shadow:0 0 14px rgba(255,210,150,.6); }
  .legend{ display:flex; justify-content:space-between; gap:8px; font-size:11px; color:var(--muted); margin-top:6px; }
  .grow{ margin:12px 0; } .grow .gq{ font-size:13.5px; margin-bottom:6px; }
  .gscale{ display:flex; gap:6px; } .gscale button{ padding:9px 0; font-size:14px; border-radius:10px; }
  .seg{ display:flex; gap:8px; } .seg.col{ flex-direction:column; }
  .seg button{ flex:1; padding:13px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.28); background:rgba(17,9,6,.4); color:var(--muted); font-weight:600; font-size:14.5px; cursor:pointer; font-family:'IBM Plex Sans Thai'; text-align:left; line-height:1.4; }
  .seg:not(.col) button{ text-align:center; }
  .cbx button::before{ content:'☐'; margin-right:8px; } .cbx button.sel::before{ content:'☑'; }
  .vote-ok{ margin-top:8px; font-size:13px; color:var(--muted); } .vote-ok.saved{ color:var(--ok); }
  .nav-row{ display:flex; gap:10px; margin-top:18px; } .nav-row .btn-ghost{ width:auto; flex:0 0 auto; padding:14px 18px; }
  .nav-row .btn-cta{ flex:1; }

  /* ===== cert ===== */
  .cert-img{ width:100%; aspect-ratio:4/5; border-radius:18px; display:block; box-shadow:0 20px 50px rgba(0,0,0,.45), 0 0 30px rgba(255,122,0,.35); background:#2a0e04; object-fit:cover; }
  .cert-wait{ width:100%; aspect-ratio:4/5; border-radius:18px; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; }
  .checklist{ display:flex; align-items:center; gap:10px; padding:11px 13px; border-radius:13px; margin-top:8px; }
  .checklist .d{ width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; background:rgba(255,255,255,.18); }
  .checklist .d.on{ background:var(--gold); color:var(--cta-text); }

  /* ===== LINE in-app guard ===== */
  .line-guard{ position:sticky; top:0; z-index:60; display:none; gap:10px; align-items:center; padding:10px 12px; margin:0 auto; max-width:480px;
    background:rgba(17,9,6,.92); border-bottom:1px solid rgba(255,165,70,.6); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); font-size:12.5px; line-height:1.45; }
  .line-guard.on{ display:flex; }
  .line-guard b{ color:var(--gold); }
  .line-guard .open{ flex-shrink:0; background:#fff; color:var(--cta-text); border:none; border-radius:10px; padding:8px 10px; font-family:'Chakra Petch'; font-weight:700; font-size:12px; cursor:pointer; }
  .line-guard .x{ background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:0 2px; }

  .cf{ position:fixed; top:-14px; width:9px; height:13px; z-index:85; pointer-events:none; animation:fall linear forwards; border-radius:2px; }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(720deg); opacity:.5; } }

  @media (min-width:820px){
    .app{ max-width:720px; }
    .screen-wrap{ padding:34px 56px 140px; }
    h1.t{ font-size:36px; } h2.t{ font-size:30px; }
    .hero{ aspect-ratio:16/9; }
  }
</style>
</head>
<body>
<div class="s2-tiles" aria-hidden="true">
  <div class="s2-tile t1">ChatGPT</div><div class="s2-tile t2">Claude</div><div class="s2-tile t3">Manus</div><div class="s2-tile t4">NotebookLM</div>
  <div class="s2-tile code t5">&lt;/&gt;</div><div class="s2-tile code t6">&lt;/&gt;</div><div class="s2-tile code t7">T</div>
</div>
<div class="line-guard" id="lineGuard" role="alert">
  <span style="font-size:20px">🌐</span>
  <span style="flex:1">กำลังเปิดในแอป <b>LINE</b> — เปิดใน <b>Safari / Chrome</b> เพื่อให้ระบบจำคุณได้และบันทึก Certificate ได้ชัวร์</span>
  <button class="open" id="lgOpen">เปิดในเบราว์เซอร์</button>

</div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="nnext-bot.js"></script>
<script>
/* =====================================================================
 * AI NEXT Season 2 — Participant app (Check-in · NEXT Passport · Missions · E-Cert)
 * ===================================================================== */
const C = window.AINEXT_CONFIG;
const { callApi, esc, readLS, writeLS, jitterInterval } = window.AINEXT;
const root = document.getElementById('app');

/* ---------------- state ---------------- */
const PROFILE_KEY = 'ainext2_profile', RESUME_KEY = 'ainext2_resume';
const getProfile = () => readLS(PROFILE_KEY);
const setProfile = p => writeLS(PROFILE_KEY, p);
const clearProfile = () => { try { localStorage.removeItem(PROFILE_KEY); localStorage.removeItem(RESUME_KEY); } catch (e) {} };
let screen = 'landing', checkinError = '', latestStatus = null, cooldownTarget = null, pendingSlam = 0, hubFingerprint = '';
let stopHubPoll = null, stopCoolPoll = null;
function stopAllPolls(){ if (stopHubPoll) { stopHubPoll(); stopHubPoll = null; } if (stopCoolPoll) { stopCoolPoll(); stopCoolPoll = null; } }
function showLoading(m){ NNext.busy(m); }
function hideLoading(msg, mood){ NNext.done(msg, mood); }
function vibrate(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
function nick(p){ return (p && (p.nick || p.firstName)) || ''; }

/* ---------------- icons ---------------- */
const I = {
  arrow: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>',
  lock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  check: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  cert: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/><circle cx="12" cy="8" r="6"/></svg>',
  chat: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'
};
function confetti(){
  const cols = ['#FFD166', '#FF7A00', '#fff', '#FF5A1F', '#FFF3D1'];
  for (let i = 0; i < 30; i++) { const d = document.createElement('div'); d.className = 'cf'; d.style.left = (Math.random() * 100) + 'vw'; d.style.background = cols[i % cols.length];
    d.style.animationDuration = (1.6 + Math.random() * 1.8) + 's'; document.body.appendChild(d); setTimeout(() => d.remove(), 4000); }
}
function burstAt(el, n){
  if (!el) return; const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < (n || 22); i++) { const p = document.createElement('div'); p.className = 'particle'; const a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 70;
    p.style.left = (cx - 4) + 'px'; p.style.top = (cy - 4) + 'px'; p.style.setProperty('--dx', Math.cos(a) * d + 'px'); p.style.setProperty('--dy', Math.sin(a) * d + 'px');
    document.body.appendChild(p); setTimeout(() => p.remove(), 1000); }
}
function slamStamp(el){
  if (!el) return; el.classList.remove('slam'); void el.offsetWidth; el.classList.add('slam');
  setTimeout(() => { burstAt(el, 26); vibrate(50); const card = el.closest('.obsidian') || el.parentNode; if (card) { card.classList.add('shake'); setTimeout(() => card.classList.remove('shake'), 400); } }, 300);
}

async function doCheckin(){
  const val = document.getElementById('nameInput').value.trim();
  if (!val) { checkinError = 'กรุณากรอกชื่อจริง ชื่อเล่น หรือเบอร์ 4 ตัวท้าย'; screenCheckin(); return; }
  const digits = val.replace(/\D/g, '');
  if (/^\d+$/.test(val.replace(/[\s-]/g, '')) && digits.length !== 4 && digits.length < 9) { checkinError = 'ถ้าค้นหาด้วยเบอร์ ให้พิมพ์ 4 ตัวท้ายนะ'; screenCheckin(); return; }
  const q = /^\d{9,}$/.test(digits) && /^[\d\s-]+$/.test(val) ? digits.slice(-4) : val;   // พิมพ์เบอร์เต็มมาก็ใช้ 4 ตัวท้ายให้
  go('validating', screenValidating); showLoading('กำลังสแกนรายชื่อ…');
  const res = await callApi('checkin', { name: q, query: q });
  hideLoading();
  if (screen !== 'validating') return;
  if (!res.success) {
    if (res.reason === 'checkin_closed') { checkinError = 'ยังไม่เปิดให้เช็คอิน — รอประกาศจากทีมงาน'; go('checkin', screenCheckin); return; }
    if (res.reason === 'not_found') { go('notfound', () => screenNotfound(val)); return; }
    checkinError = 'เครือข่ายไม่เสถียร ลองอีกครั้งนะ'; go('checkin', screenCheckin); return;
  }
  if (res.multiple) { go('choose', () => screenChoose(res.people)); return; }
  applyProfile(res);
}

  setProfile({ attendeeId: res.attendeeId, runNo: res.runNo, firstName: res.firstName, lastName: res.lastName, nick: res.nick, team: res.team, menu: res.menu, group: res.group });

}

async function screenHub(){
  if (screen !== 'hub') return;
  const p = getProfile(); if (!p) { go('landing', screenLanding); return; }
  NNext.mood('idle'); NNext.setTips(hubTips);
  const st = await callApi('getStatus', { attendeeId: p.attendeeId });
  if (screen !== 'hub') return;
  if (!st.success) { if (st.reason === 'network' || st.reason === 'busy') { NNext.say('สัญญาณไม่ค่อยดี กำลังลองใหม่…'); setTimeout(screenHub, 3000); return; } clearProfile(); go('landing', screenLanding); return; }
  latestStatus = st;
  if (!st.checkedIn) { go('gate', screenGate); return; }
  renderHub(st);
  if (!pendingSlam) setTimeout(() => { if (screen === 'hub') NNext.nextTip(); }, 600);
  stopAllPolls();
  stopHubPoll = jitterInterval(refreshHub, C.HUB_POLL_MS, 3000);
}
async function refreshHub(){
  if (screen !== 'hub') return;
  const p = getProfile(); if (!p) return;
  const st = await callApi('getStatus', { attendeeId: p.attendeeId });
  if (screen !== 'hub' || !st.success) return;
  const before = latestStatus || {}; latestStatus = st;
  if (fp(st) !== hubFingerprint) {
    const opened = [1, 2, 3].find(n => st['mission' + n + '_open'] && !before['mission' + n + '_open']);
    renderHub(st);
    if (opened) { NNext.say(`🔓 <b>Mission ${opened}</b> เปิดแล้ว! แตะทำเลยได้เลย`, { mood: 'happy' }); vibrate(30); }
    else if (st.cert_open && !before.cert_open) NNext.say('🎖 ทีมงานปล่อย <b>E-Certificate</b> แล้ว!', { mood: 'happy' });
  }
}
function renderHub(st){
  const p = getProfile(), done = st.done || {}, cnt = (done.m1 ? 1 : 0) + (done.m2 ? 1 : 0) + (done.m3 ? 1 : 0);
  hubFingerprint = fp(st);
  const rings = M_META.map(m => {
    const isDone = done['m' + m.n], isOpen = st['mission' + m.n + '_open'];
    const cls = isDone ? 'done' : isOpen ? 'open' : '';
    return `<div class="ring-wrap"><div class="ring ${cls}" id="ring-${m.n}">${isDone ? I.check : isOpen ? m.n : '🔒'}</div><div class="rl">M${m.n}</div><div class="rs">${isDone ? 'ได้แสตมป์' : isOpen ? 'เปิดแล้ว' : 'รอปลดล็อก'}</div></div>`;
  }).join('');

let curMission = 0, curPart = 0, answers = {}, draftTimer = null;

function qNumberBase(n, partIdx){ let c = 0; for (let i = 0; i < partIdx; i++) c += FORMS[n].parts[i].items.length; return c; }
function saveDraft(){

function openMission(n, partIdx){
  stopAllPolls(); NNext.mood('idle');

  const isNew = curMission !== n;
  curMission = n;
  if (isNew) {
    answers = (draft && draft.answers) || {};
    curPart = partIdx != null ? partIdx : (draft && draft.part) || 0;
    if (draft && Object.keys(draft.answers || {}).length) NNext.say('💾 กู้คืนคำตอบที่ร่างไว้ให้แล้ว ทำต่อได้เลย!', { mood: 'happy' });
    else if (n === 3) NNext.say('Mission 3 แบ่งเป็น <b>3 ขั้นสั้น ๆ</b> — ทุกคำตอบเซฟอัตโนมัติ สลับไป LINE ก็ไม่หาย 💾', { mood: 'happy' });
    else NNext.say(`ตอบ 5 ข้อสั้น ๆ รับแสตมป์ <b>Mission ${n}</b> ได้เลย ✍️`, { mood: 'happy' });
  } else if (partIdx != null) curPart = partIdx;
  const st = latestStatus || {};
  if (n === 3 && st.myVote) answers.vote = st.myVote;           // โหวตบนเซิร์ฟเวอร์สำคัญกว่าร่าง
  if (n === 3 && answers.vote && (st.voteOptions || []).indexOf(answers.vote) < 0) delete answers.vote;

function renderMission(){

    qn++;

    if (it.hint) h += `<div class="qhint">${esc(it.hint)}</div>`;
    if (it.noteHtml) h += `<div class="qhint">${it.noteHtml}</div>`;
    const a = answers[it.k];
    if (it.t === 'vote') {
      const opts = st.voteOptions || [];
      if (!opts.length) h += `<div class="err">ยังไม่มีทีมให้โหวตในกลุ่มของคุณ</div>`;
      else h += `<select class="field" id="voteSel"><option value="">— เลือกทีมใน Group ${st.group || '-'} (ยกเว้นทีมคุณ) —</option>${opts.map(t => `<option value="${esc(t)}" ${t === a ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
        <div id="voteMsg" class="vote-ok ${st.myVote ? 'saved' : ''}">${st.myVote ? '✓ บันทึกโหวตแล้ว: <b>' + esc(st.myVote) + '</b> · เปลี่ยนใจได้จนกว่าจะส่ง' : 'เลือกแล้วบันทึกเรียลไทม์ทันที · เปลี่ยนได้ภายหลัง'}</div>`;
    }
    else if (it.t === 'text') h += `<textarea class="field" data-k="${it.k}" placeholder="พิมพ์คำตอบ… (เซฟอัตโนมัติ)">${esc(a || '')}</textarea>`;
    else if (it.t === 'scale5' || it.t === 'scale0_10') {
      const lo = it.t === 'scale0_10' ? 0 : 1, hi = it.t === 'scale0_10' ? 10 : 5;
      h += `<div class="scale${it.t === 'scale0_10' ? ' ten' : ''}">`; for (let i = lo; i <= hi; i++) h += `<button type="button" data-pick="${it.k}" data-v="${i}" class="${a === i ? 'sel' : ''}">${i}</button>`; h += '</div>';
      if (it.lo || it.hi) h += `<div class="legend"><span>${esc(it.lo || '')}</span><span>${esc(it.hi || '')}</span></div>`;
    }
    else if (it.t === 'grid') {
      it.rows.forEach((rw, ri) => { const gk = it.k + '_' + (ri + 1); h += `<div class="grow"><div class="gq">${ri + 1}) ${esc(rw)}</div><div class="gscale">`;
        for (let i = 1; i <= 5; i++) h += `<button type="button" data-pick="${gk}" data-v="${i}" class="${answers[gk] === i ? 'sel' : ''}">${i}</button>`; h += '</div></div>'; });
      if (it.legend) h += `<div class="qhint" style="margin:6px 0 0">${esc(it.legend)}</div>`;
    }
    else if (it.t === 'radio' || it.t === 'seg') {
      h += `<div class="seg ${it.t === 'radio' ? 'col' : ''}">`; it.opts.forEach(o => { h += `<button type="button" data-seg="${it.k}" class="${a === o ? 'sel' : ''}">${esc(o)}</button>`; }); h += '</div>';
    }
    else if (it.t === 'checkbox') {
      const sel = (answers['_' + it.k] && answers['_' + it.k].sel) || [], oth = (answers['_' + it.k] && answers['_' + it.k].other) || '';
      h += `<div class="seg col cbx" data-cbx="${it.k}">`; it.opts.forEach(o => { h += `<button type="button" data-v="${esc(o)}" class="${sel.indexOf(o) >= 0 ? 'sel' : ''}">${esc(o)}</button>`; }); h += '</div>';
      if (it.other) h += `<input class="field mt" data-other="${it.k}" placeholder="อื่น ๆ (โปรดระบุ)" value="${esc(oth)}">`;
    }
    h += '</div>';
  });

      catch (e) { if (e && e.name !== 'AbortError') download(); }
    };
    db.onclick = download;
  });
}

/* ================= INIT ================= */
(function init(){
  if (C.DEMO_MODE) AINEXT.seedDemo();
  const p = getProfile();
  if (!p) { go('landing', screenLanding); return; }
  // กลับมาจากลิงก์ภายนอก (เช่น LINE Meetup ใน Q20) → พากลับไปที่ฟอร์มเดิมพร้อมร่าง
  const resume = readLS(RESUME_KEY);
  if (resume && resume.mission) {
    screen = 'resume'; showLoading('กำลังพากลับไปที่ฟอร์มเดิม…');
    callApi('getStatus', { attendeeId: p.attendeeId }).then(st => {
      hideLoading();
      if (st.success && st.checkedIn && st['mission' + resume.mission + '_open'] && !(st.done || {})['m' + resume.mission]) { latestStatus = st; openMission(resume.mission, resume.part || 0); }
      else { try { localStorage.removeItem(RESUME_KEY); } catch (e) {} go('hub', screenHub); }
    });
    return;
  }
  go('hub', screenHub);
})();
document.addEventListener('visibilitychange', () => { if (document.hidden && screen === 'mission') saveDraft(); });
window.addEventListener('pagehide', () => { if (screen === 'mission') saveDraft(); });
</script>
